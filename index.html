<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DN MOVIES - Free Movies & TV Shows</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(22, 27, 38, 0.7); backdrop-filter: blur(10px); }
        .active-tab { color: #ef4444; border-bottom: 2px solid #ef4444; }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans min-h-screen pb-24">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-[#0b0f19]/90 backdrop-blur-md border-b border-gray-800/60 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <button class="md:hidden text-gray-300"><i data-lucide="menu" class="w-6 h-6"></i></button>
                <h1 class="text-xl font-black tracking-wider text-red-600 flex items-center gap-1.5 cursor-pointer" onclick="location.reload()">
                    DN MOVIES
                </h1>
            </div>
            
            <!-- Live Search Bar -->
            <div class="relative flex-1 max-w-md">
                <input type="text" id="searchInput" placeholder="Search Movies, TV Series, Anime..." 
                    class="w-full bg-gray-900/90 border border-gray-700/80 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-red-600 transition text-gray-200">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

        <!-- Featured Banner / Carousel -->
        <section id="heroSection" class="relative rounded-3xl overflow-hidden bg-gray-900 h-72 md:h-[420px] flex items-end p-6 border border-gray-800 shadow-2xl">
            <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-all duration-700 opacity-50"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-[#0b0f19]/40 to-transparent"></div>
            
            <div class="relative z-10 max-w-2xl space-y-3">
                <span id="heroBadge" class="bg-red-600 text-white text-[11px] font-black px-3 py-1 rounded-full uppercase tracking-wider">FEATURED</span>
                <h2 id="heroTitle" class="text-2xl md:text-4xl font-black text-white leading-tight">Loading...</h2>
                <p id="heroOverview" class="text-xs md:text-sm text-gray-300 line-clamp-2 md:line-clamp-3 font-normal"></p>
                <div class="pt-2 flex items-center gap-3">
                    <button id="heroPlayBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-full font-bold text-sm flex items-center gap-2 transition shadow-lg shadow-red-600/30">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i> Watch Now
                    </button>
                </div>
            </div>
        </section>

        <!-- Dynamic Category Tabs -->
        <div class="flex items-center gap-6 border-b border-gray-800 text-sm font-semibold text-gray-400">
            <button onclick="switchTab('all')" id="tab-all" class="pb-3 active-tab transition">All</button>
            <button onclick="switchTab('movie')" id="tab-movie" class="pb-3 hover:text-white transition">Movies</button>
            <button onclick="switchTab('tv')" id="tab-tv" class="pb-3 hover:text-white transition">TV Series & Cartoons</button>
        </div>

        <!-- Media Grid -->
        <section>
            <h3 id="sectionTitle" class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i data-lucide="sparkles" class="text-red-500 w-5 h-5"></i> Trending Content
            </h3>
            <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- Media Cards will be dynamically injected here -->
            </div>
        </section>

    </main>

    <!-- Bottom Mobile Navigation Bar (Dulo UI Feature) -->
    <nav class="fixed bottom-0 inset-x-0 z-40 bg-[#0b0f19]/95 backdrop-blur-lg border-t border-gray-800/80 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-between items-center text-gray-400 text-[11px] font-medium">
            <button onclick="switchTab('all')" class="flex flex-col items-center gap-1 text-red-500">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span>Home</span>
            </button>
            <button onclick="switchTab('tv')" class="flex flex-col items-center gap-1 hover:text-white">
                <i data-lucide="tv" class="w-5 h-5"></i>
                <span>Series</span>
            </button>
            <button onclick="switchTab('movie')" class="flex flex-col items-center gap-1 hover:text-white">
                <i data-lucide="film" class="w-5 h-5"></i>
                <span>Movies</span>
            </button>
        </div>
    </nav>

    <!-- Embedded Video Player Modal -->
    <div id="playerModal" class="fixed inset-0 z-50 bg-black/95 hidden flex-col justify-center items-center p-2 md:p-6">
        <div class="w-full max-w-5xl flex justify-between items-center mb-3 px-2">
            <h3 id="modalTitle" class="text-base md:text-lg font-bold text-white truncate max-w-md"></h3>
            <button onclick="closePlayer()" class="bg-gray-800 hover:bg-red-600 text-white p-2 rounded-full transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="w-full max-w-5xl aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800">
            <iframe id="videoIframe" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = 'c2e2abdddbcdbb4142f36f9bc68d1847';
        const grid = document.getElementById('mediaGrid');
        const searchInput = document.getElementById('searchInput');
        let currentTab = 'all';

        async function loadContent() {
            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}`;
            if (currentTab === 'movie') url = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`;
            if (currentTab === 'tv') url = `https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}`;

            const res = await fetch(url);
            const data = await res.json();
            displayMedia(data.results);
            if (data.results.length > 0 && currentTab === 'all') setHero(data.results[0]);
        }

        function setHero(item) {
            const mediaType = item.media_type || (item.title ? 'movie' : 'tv');
            document.getElementById('heroBg').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${item.backdrop_path})`;
            document.getElementById('heroTitle').innerText = item.title || item.name;
            document.getElementById('heroOverview').innerText = item.overview;
            document.getElementById('heroPlayBtn').onclick = () => openPlayer(mediaType, item.id, item.title || item.name);
        }

        function displayMedia(items) {
            grid.innerHTML = '';
            items.forEach(item => {
                if (!item.poster_path) return;
                const mediaType = item.media_type || (item.title ? 'movie' : 'tv');
                const card = document.createElement('div');
                card.className = "bg-gray-900/80 border border-gray-800 rounded-xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 hover:border-red-600/50 transition duration-300 group";
                card.onclick = () => openPlayer(mediaType, item.id, item.title || item.name);

                card.innerHTML = `
                    <div class="relative overflow-hidden">
                        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" class="w-full h-60 md:h-64 object-cover group-hover:opacity-80 transition">
                        <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-yellow-400 text-[10px] font-bold px-2 py-0.5 rounded-md border border-yellow-500/20">
                            ★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}
                        </span>
                        <span class="absolute bottom-2 left-2 bg-red-600/90 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase">
                            ${mediaType}
                        </span>
                    </div>
                    <div class="p-2.5">
                        <h4 class="font-bold text-xs truncate text-gray-100 group-hover:text-red-500 transition">${item.title || item.name}</h4>
                        <p class="text-[10px] text-gray-400 mt-0.5">${(item.release_date || item.first_air_date || '').split('-')[0]}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'movie', 'tv'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) btn.className = t === tab ? 'pb-3 active-tab transition' : 'pb-3 hover:text-white transition';
            });
            document.getElementById('sectionTitle').innerText = tab === 'all' ? 'Trending Content' : (tab === 'movie' ? 'Popular Movies' : 'TV Series & Cartoons');
            loadContent();
        }

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length > 2) {
                document.getElementById('sectionTitle').innerText = `Search Results for "${query}"`;
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                displayMedia(data.results);
            } else if (query.length === 0) {
                switchTab(currentTab);
            }
        });

        function openPlayer(type, id, title) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            document.getElementById('modalTitle').innerText = title;

            // Auto Embed Player Engine
            iframe.src = type === 'movie' 
                ? `https://vidsrc.me/embed/movie?tmdb=${id}`
                : `https://vidsrc.me/embed/tv?tmdb=${id}&season=1&episode=1`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoIframe');
            iframe.src = '';
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        lucide.createIcons();
        loadContent();
    </script>
</body>
</html>
